name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -e -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ammu-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Push APK to apk-release branch
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-release || git checkout -B apk-release
          git rm -rf . || true
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" ammu-player-debug.apk
            git add ammu-player-debug.apk
            git commit -m "release: latest compiled apk [skip ci]" || true
            git push -u origin apk-release --force || true
          fi

      - name: Publish GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            gh release create v1.0.0 "$APK_PATH" \
              --title "Ammu Audio Player v1.0.0" \
              --notes "Production-ready, offline-first native Android audio player with AMOLED Black UI, Media3 ExoPlayer, Dual DSP Equalizer, and 4-Key Vault Security." \
              --clobber || true
          fi

      - name: Push Build Log to ci-log branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-log || git checkout -B ci-log
          git rm -rf . || true
          if [ -f build.log ]; then
            cp build.log current_build.log
            git add current_build.log
            git commit -m "ci: update build log [skip ci]" || true
            git push -u origin ci-log --force || true
          fi

      - name: Publish Build Summary / Logs
        if: always()
        run: |
          echo "=== BUILD LOG HEAD ==="
          head -n 50 build.log || true
          echo "=== BUILD LOG ERRORS ==="
          grep -E "e: |FAILURE:|Error:|FAILED" build.log || true
          echo "=== BUILD LOG TAIL ==="
          tail -n 150 build.log || true
          echo "### Gradle Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            echo "#### Error lines:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -E "e: |FAILURE:|Error:|FAILED" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "#### Last 150 lines of build log:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No build.log found" >> $GITHUB_STEP_SUMMARY
          fi
